<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jagannath Art | JAGANNATHCRAFATE</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      text-align: center;
      background: linear-gradient(135deg, #fff3e0, #fce4ec, #e8eaf6);
    }

    .page {
      padding: 50px 20px;
    }

    h1 {
      font-size: 45px;
      color: #7b1fa2;
    }

    .card {
      max-width: 800px;
      margin: 30px auto;
      padding: 30px;
      background: white;
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    }

    .card img {
      width: 80%;
      max-width: 500px;
      border-radius: 20px;
    }

    .btn {
      display: inline-block;
      margin: 20px 10px;
      padding: 14px 25px;
      border-radius: 30px;
      text-decoration: none;
      color: white;
      background: #7b1fa2;
      font-weight: bold;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .floating {
      position: fixed;
      font-size: 35px;
      animation: float 4s ease-in-out infinite;
    }

    .one {
      top: 15%;
      left: 8%;
    }

    .two {
      top: 30%;
      right: 8%;
    }

    .three {
      bottom: 20%;
      left: 12%;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-25px);
      }
    }
  </style>
</head>

<body>

  <div class="floating one">🛕</div>
  <div class="floating two">✨</div>
  <div class="floating three">🌸</div>

  <div class="page">

    <h1>🛕 Jagannath Art</h1>

    <div class="card">

      <img
        src="images/jagannath-idols.jpg"
        alt="Jagannath Art">

      <h2>Welcome to Jagannath Art</h2>

      <p>
        Explore our beautiful handmade Jagannath art,
        idols, paintings and decorative creations.
      </p>

      <a href="index.html" class="btn">
        🏠 Back to Home
      </a>

      <a href="index.html#order" class="btn">
        ✨ Order This Category
      </a>

    </div>

  </div>

</body>
</html>
